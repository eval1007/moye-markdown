[package]
name = "moye-reader"
version = "0.0.5"
license = "MIT"
description = "Moye local Markdown reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
nucleo-matcher = "0.3"
notify = "8"

[profile.release]
strip = true
